services:
  - type: web
    name: juloos-volunteer-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCR_ENABLED
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: juloos-db
          property: connectionString
databases:
  - name: juloos-db
    plan: free
